<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متاهة الحب لـ حمودي 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ffb6c1;
        }
        .room-indicator {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .question-box {
            font-size: 17px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 5px;
        }
        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff6b81;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .content-box {
            display: none;
            font-size: 16px;
            line-height: 1.8;
            color: #fff;
            animation: fadeIn 0.5s ease-in-out;
        }
        .content-box p {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="game-container">
        <div class="room-indicator" id="room-title">الغرفة 1 من 6: الاشتياق 🌹</div>
        
        <!-- قسم السؤال -->
        <div id="quiz-section">
            <div class="question-box" id="question-text"></div>
            <input type="text" id="answer-input" placeholder="اكتب إجابتك هون...">
            <button onclick="checkAnswer()">تأكيد الإجابة 🤍</button>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <!-- قسم محتوى الغرفة اللي بيظهر بعد الإجابة الصح -->
        <div class="content-box" id="content-section">
            <h1>فتحنا الباب! 🎉🔓</h1>
            <p id="room-message"></p>
            <button onclick="nextRoom()" id="next-btn">الانتقال للغرفة التالية ✨</button>
        </div>
    </div>

    <script>
        const rooms = [
            {
                title: "الغرفة 1 من 6: الاشتياق 🌹",
                question: "شو أكتر شي بحب اعملو أول ما بفيق من النوم؟",
                answers: ["اني اسمع صوتك", "اسمع صوتك", "انّي اسمع صوتك", "سماع صوتك"],
                message: "برافو يا روحي! أول فكرة بتخطر عبالي وأول شي بتمنه أول ما تفتح عيوني، هو إني أسمع صوتك ليبدأ نهاردي صح ودافي فيك 🤍."
            },
            {
                title: "الغرفة 2 من 6: الاعترافات 💌",
                question: "شو أكتر كلمة بحب دايماً أسمعها منك؟",
                answers: ["يا بنوتي", "بنوتي"],
                message: "صح يا قلبي! لما بتقولي 'يا بنوتي' بحس بالدفا والأمان كله، وكأني ملكت الدنيا وما فيها بحرف منك 🎀."
            },
            {
                title: "الغرفة 3 من 6: أسباب الحب ❤️",
                question: "بأي تاريخ عيد ميلادي يلي لازم ما تنساه أبداً؟ (كتبه بالشكل الصحيح)",
                answers: ["08/08/2001", "8/8/2001", "2001/08/08"],
                message: "إي أوكيه حافظ التاريخ ولازم ما تنساه أبداً! هاد أثمن تاريخ ولد فيه الإنسان اللي غير حياتي وقلب دنيتي للأحلى 🎂✨."
            },
            {
                title: "الغرفة 4 من 6: الأمنيات ⭐",
                question: "شو أكتر شي بيتمناه قلبي بحياتي معك؟ (سهلتلك ياها وماتتعب حالك بالتفكير.. الجواب واضح وصارخ 😉❤️)",
                answers: ["حضنك", "حضنك انت", "حضن منك"],
                message: "يا عيني عليك عرفتها فوراً! ما بتمنى بهالدنيا أكتر من حضنك الدافئ اللي بينسيني كل تعب المسافات 🫂❤️."
            },
            {
                title: "الغرفة 5 من 6: الذكريات 🕯️",
                question: "شو أكتر صفة بحبها فيك ودايماً بتخليني أعزك أكتر؟ (بدها ذكاء خفيف، بس أنت قدها 😌)",
                answers: ["الحنية", "حنيتك", "الحنيه"],
                message: "يا عمري أنت، حنيتك هي أكتر شي بيسحرني فيك وبتخليني أعشقك كل يوم أكتر من قبلو، الله ليحرمني من قلبك الطيب 🤍."
            },
            {
                title: "الغرفة 6 من 6: الحضن الأخير 🤍",
                question: "من وين هو الشخص الغالي اللي ساكن قلبي وروحي؟ (يلا سهلتها عليك ع الآخر، لا تخيب ظني عاد 😜)",
                answers: ["سوريا", "سوريا 🇸🇾"],
                message: "يا عمري وروح قلبي أنت! سوريا وريحتها و أهلها.. ومحلك الحقيقي هونيك بقلبي وروحي للأبد 🇸🇾🤍."
            }
        ];

        let currentRoom = 0;

        function loadRoom() {
            if (currentRoom < rooms.length) {
                document.getElementById("room-title").innerText = rooms[currentRoom].title;
                document.getElementById("question-text").innerText = rooms[currentRoom].question;
                document.getElementById("answer-input").value = "";
                document.getElementById("error-msg").innerText = "";
                
                // إظهار قسم الأسئلة وإخفاء قسم المحتوى
                document.getElementById("quiz-section").style.display = "block";
                document.getElementById("content-section").style.display = "none";
            } else {
                // شاشة النهاية بعد ما يخلص كل الغرف
                document.getElementById("room-title").innerText = "نهاية المتاهة 🤍✨";
                document.getElementById("quiz-section").style.display = "none";
                document.getElementById("content-section").style.display = "block";
                document.getElementById("room-message").innerHTML = "<strong>مبروك يا روحي! 🔓✨</strong><br>فتحت كل الأبواب ووصلت لنهاية المتاهة.. وهلأ صار لازم تعرف إنك مو بس ساكن بقلبي، أنت القلب وروحي وكل دنيتي يا أغلى حمودي بالعالم! 🥹🤍🫂";
                document.getElementById("next-btn").style.display = "none"; // إخفاء زر التبديل بالنهاية
            }
        }

        function checkAnswer() {
            let userVal = document.getElementById("answer-input").value.trim().toLowerCase();
            let validAnswers = rooms[currentRoom].answers;

            let isCorrect = validAnswers.some(ans => userVal.includes(ans.toLowerCase()));

            if (isCorrect) {
                // إخفاء السؤال وإظهار رسالة ومحتوى الغرفة
                document.getElementById("quiz-section").style.display = "none";
                document.getElementById("room-message").innerText = rooms[currentRoom].message;
                document.getElementById("content-section").style.display = "block";
            } else {
                document.getElementById("error-msg").innerText = "خطأ يا حمودي! ركز شوي وتذكرني مليح ورجع جرب 😜❌";
            }
        }

        function nextRoom() {
            currentRoom++;
            loadRoom();
        }

        // بدء اللعبة
        loadRoom();
    </script>
</body>
</html>
