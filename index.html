<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متاهة الحب لـ حمودي 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffb6c1;
        }
        .room-indicator {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff6b81;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .success-screen {
            display: none;
        }
        .final-gate {
            font-size: 20px;
            color: #ffef9f;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="container" id="game-container">
        <div id="quiz-screen">
            <div class="room-indicator" id="room-title">الغرفة 1 من 6: الاشتياق 🌹</div>
            <div class="question-box" id="question-text"></div>
            <input type="text" id="answer-input" placeholder="اكتب إجابتك هون...">
            <button onclick="checkAnswer()">تأكيد الإجابة 🤍</button>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="success-screen" id="success-screen">
            <h1>مبروك يا روحي! 🔓✨</h1>
            <p class="final-gate" style="margin-top: 15px;">
                فتحت كل الأبواب ووصلت لنهاية المتاهة.. وهلأ صار لازم تعرف إنك مو بس ساكن بقلبي، أنت القلب وروحي وكل دنيتي يا أغلى حمودي بالعالم! 🥹🤍🫂
            </p>
        </div>
    </div>

    <script>
        const rooms = [
            {
                title: "الغرفة 1 من 6: الاشتياق 🌹",
                question: "شو أكتر شي بحب اعملو أول ما بفيق من النوم؟",
                answers: ["اني اسمع صوتك", "اسمع صوتك", "انّي اسمع صوتك", "سماع صوتك"]
            },
            {
                title: "الغرفة 2 من 6: الاعترافات 💌",
                question: "شو أكتر كلمة بحب دايماً أسمعها منك؟",
                answers: ["يا بنوتي", "بنوتي"]
            },
            {
                title: "الغرفة 3 من 6: أسباب الحب ❤️",
                question: "بأي تاريخ عيد ميلادي يلي لازم ما تنساه أبداً؟ (كتبه بالشكل الصحيح)",
                answers: ["08/08/2001", "8/8/2001", "2001/08/08"]
            },
            {
                title: "الغرفة 4 من 6: الأمنيات ⭐",
                question: "شو أكتر شي بيتمناه قلبي بحياتي معك؟ (سهلتلك ياها وماتتعب حالك بالتفكير.. الجواب واضح وصارخ 😉❤️)",
                answers: ["حضنك", "حضنك انت", "حضن منك"]
            },
            {
                title: "الغرفة 5 من 6: الذكريات 🕯️",
                question: "شو أكتر صفة بحبها فيك ودايماً بتخليني أعزك أكتر؟ (بدها ذكاء خفيف، بس أنت قدها 😌)",
                answers: ["الحنية", "حنيتك", "الحنيه"]
            },
            {
                title: "الغرفة 6 من 6: الحضن الأخير 🤍",
                question: "من وين هو الشخص الغالي اللي ساكن قلبي وروحي؟ (يلا سهلتها عليك ع الآخر، لا تخيب ظني عاد 😜)",
                answers: ["سوريا", "سوريا 🇸🇾"]
            }
        ];

        let currentRoom = 0;

        function loadRoom() {
            if (currentRoom < rooms.length) {
                document.getElementById("room-title").innerText = rooms[currentRoom].title;
                document.getElementById("question-text").innerText = rooms[currentRoom].question;
                document.getElementById("answer-input").value = "";
                document.getElementById("error-msg").innerText = "";
            } else {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("success-screen").style.display = "block";
            }
        }

        function checkAnswer() {
            let userVal = document.getElementById("answer-input").value.trim().toLowerCase();
            let validAnswers = rooms[currentRoom].answers;

            // تنظيف النص المدخل للمقارنة البسيطة
            let isCorrect = validAnswers.some(ans => userVal.includes(ans.toLowerCase()));

            if (isCorrect) {
                currentRoom++;
                loadRoom();
            } else {
                document.getElementById("error-msg").innerText = "خطأ يا حمودي! ركز شوي وتذكرني مليح ورجع جرب 😜❌";
            }
        }

        // بدء اللعبة
        loadRoom();
    </script>
</body>
</html>
