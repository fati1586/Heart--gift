<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلك... 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{background:#000;color:#fff;overflow:hidden}
 .screen{width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;position:absolute;top:0;left:0;opacity:0;pointer-events:none;transition:opacity 1.5s}
 .active{opacity:1;pointer-events:all;z-index:2}
 .typewriter{font-size:clamp(16px,4vw,26px);line-height:2.2;white-space:pre-wrap}
  .stars{position:absolute;width:100%;height:100%;top:0;left:0;overflow:hidden}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
  .heart{position:absolute;font-size:20px;color:#ff4d6d;animation:floatUp 8s linear infinite}
  @keyframes floatUp{0%{transform:translateY(100vh) scale(0)}100%{transform:translateY(-100vh) scale(1);opacity:0}}
  .butterfly{position:absolute;font-size:24px;animation:fly 10s linear infinite}
  @keyframes fly{0%{transform:translate(0,100vh) rotate(0)}100%{transform:translate(100vw,-100vh) rotate(360deg);opacity:0}}
  button{background:rgba(255,255,255,0.1);border:1px solid #fff;color:#fff;padding:15px 40px;font-size:20px;border-radius:50px;cursor:pointer;transition:0.3s;margin-top:20px}
  button:hover{background:#fff;color:#000;transform:scale(1.05)}
  input{background:transparent;border:none;border-bottom:2px solid #fff;color:#fff;font-size:18px;padding:10px;text-align:center;width:80%;max-width:300px}
  input:focus{outline:none;border-color:#ff4d6d}
  .envelope{font-size:100px;cursor:pointer;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .door{font-size:120px;cursor:pointer}
  .room{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;max-width:90%;overflow-y:auto;max-height:60vh}
  .item{font-size:40px;cursor:pointer;transition:0.3s;padding:10px}
  .item:hover{transform:scale(1.3)}
  .message{font-size:18px;line-height:1.8;max-width:90%;margin:20px 0}
  .big-heart{font-size:150px;animation:beat 1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .hidden{display:none}
  .start-btn{font-size:24px;color:#ffb3c1;cursor:pointer;animation:pulse 2s infinite}
</style>
</head>
<body>
<audio id="bgMusic" loop src="https://cdn.pixabay.com/audio/2025/04/24/audio_0d2b3e8c7a.mp3"></audio>

<!-- الشاشة 1: زر البداية -->
<div class="screen active" id="start">
  <div class="stars" id="stars"></div>
  <div class="start-btn" onclick="begin()">✨<br>مرحبًا... اضغط هنا لنبدأ الرحلة</div>
</div>

<!-- الشاشة 2: النص -->
<div class="screen" id="textScreen">
  <div class="typewriter" id="type"></div>
</div>

<!-- الشاشة 3: الظرف -->
<div class="screen" id="envelopeScreen">
  <div class="envelope" onclick="goToKey()">💌</div>
  <p>إلك...</p>
</div>

<!-- الشاشة 4: المفتاح -->
<div class="screen" id="keyScreen">
  <div style="font-size:80px">🗝️</div>
  <button onclick="goToDoor(1)">🤍 افتح بيت قلبي</button>
</div>

<!-- الباب 1 -->
<div class="screen" id="door1">
  <div class="door">🚪</div
